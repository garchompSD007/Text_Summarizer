<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Summarizer</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/index.css') }}">
    <!-- <script src="{{ url_for('static', path='/index.js') }}" defer></script> -->
</head>
<body>
    <div class="container">
        <h1> Text Summarizer</h1>
        <h3> Using HuggingFace Tranformer</h3>
        <p>Write or paste your content bellow for quick summarization</p>

        <form id="summarization-form">
            <textarea id="dialogue-input" placeholder="Enter your cotent here...." required></textarea>
            <button type="submit">Summarize</button>
        </form>


        <div class="summary-output">
            <h3 id="summary-heading">Content Summary</h3>
            <p id="summary-text"></p>
        </div>
    </div>
    <script src="{{ url_for('static', path='/index.js') }}"></script>
</body>
</html>
